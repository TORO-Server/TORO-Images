name: images

# 自前で作らないサーバー (images/ の下) を、公式の実行ファイルだけの小さいイメージにする。
# 試験 (それぞれの smoke.sh) に通ったものだけを main から GHCR に置く。プルリクエストは試験まで (置かない)
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [caddy, cloudflared, headless-shell, lavalink]
    env:
      NAME: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=images-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.image }}

      - name: 試験
        run: bash "images/$NAME/smoke.sh" "local/$NAME:ci"

      - name: 大きさ
        run: |
          # この runner の Docker では、レジストリに置く形 (圧縮した大きさ) が出る。本番で展開した大きさとは違う
          size=$(docker image inspect "local/$NAME:ci" --format '{{.Size}}')
          echo "$NAME: $((size / 1048576)) MiB (圧縮)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: GHCR に置く
        if: github.event_name != 'pull_request'
        run: bash images/publish.sh "$NAME" "local/$NAME:ci"

  # pd / tikv / tidb は同じ版で組にして動かすので、一緒に作って一緒に確かめる
  tidb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/pd/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/pd:ci
          cache-from: type=gha,scope=images-pd
          cache-to: type=gha,mode=max,scope=images-pd

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/tikv/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/tikv:ci
          cache-from: type=gha,scope=images-tikv
          cache-to: type=gha,mode=max,scope=images-tikv

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/tidb/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/tidb:ci
          cache-from: type=gha,scope=images-tidb
          cache-to: type=gha,mode=max,scope=images-tidb

      - name: 大きさ
        run: |
          for name in pd tikv tidb; do
            size=$(docker image inspect "local/$name:ci" --format '{{.Size}}')
            echo "$name: $((size / 1048576)) MiB (圧縮)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: 試験 (いまの本番の版で作ったデータを開く)
        run: bash images/tidb/smoke.sh local/pd:ci local/tikv:ci local/tidb:ci v7.5.8

      - name: GHCR に置く
        if: github.event_name != 'pull_request'
        run: |
          for name in pd tikv tidb; do
            bash images/publish.sh "$name" "local/$name:ci"
          done
